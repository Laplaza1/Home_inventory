<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
    <script src="../js/dashboard.js"></script>
    <link rel="stylesheet" href="inventory.css">
    <title>Dashboard</title>
    
</head>
<body>
  <nav>
        <ul><a href="inventory.html">Inventory</a></ul>
         <ul><a href="show_recipies.html">Recipes</a></ul>
        <ul><a href="create.html">Create Ingredient</a></ul>
        <ul><a href="create_recipie.html">Create Recipe</a></ul>
    </nav>
    <div id="loading-screen">
        <div class="spinner">
        </div>
    </div>
    <div id="main-content" style="display: none;"></div>
    <div id="Info">
        <div id="users" >
            <div id="user_Div" class="info_Item">
                <h3>Number of Users</h3>
                <p id="userNums">0</p>
            </div>
            
            <div id="home_Div" class="info_Item">
                <h3>Number of homes</h3>
                <p id="homeNums">0</p>
            </div>
            <div id="pend_Div" class="info_Item">
                <h3>Number of pending users</h3>
                <p id="pendNums">0</p>
                <button id="collapse_button" type="button">Check</button>
                <div id="pendApps">
                  <div id="pendApper" class="hidden">
                    <p id="userName"></p>
                    <p id="email"></p>
                    <p id="home"></p>
                    <p id="passWord"></p>
                    <p id="phoneNumber"></p>
                    <p id="Reason"></p>
                    <button id="approve">Approve</button>
                    <button id="deny">Deny</button>
                  </div>
                </div>
            </div>
            <div id="item_Div" class="info_Item">
                <div id="itemHeader">
                    <h3>Number of items</h3>
                    <p id="itemNums">0</p>
                </div>
                <div id="itemTypeInfo" >
                    <div id="donut">
                        <canvas id="myChart" style="width:600px;max-width:600px;max-height: fit-content;"></canvas>
                    </div>
                    
                </div>
            </div>
        </div>

</body>
<script>
    
let xValues = ["Meat", "Vegetable","Spice", "Diary", "Animal", "Cleaning","Fruit","Other"];
let yValues = [55, 49, 44, 0, 15,22,11];
const barColors = [
  "#b91d47",
  "#00aba9",
  "#2b5797",
  "#e8c3b9",
  "#1e7145",
  "#fdee00",
  "#a25197"
];

const ctx = document.getElementById('myChart');

let myChart= new Chart(ctx, {
  type: "doughnut",
  data: {
    labels: xValues,
    datasets: [{
      backgroundColor: barColors,
      data: yValues
    }]
  },
  options: {
    plugins: {
      legend: 
        {
            display:true,
            labels: {
                color:"white"
            }
        },
      title: {
        display: true,
        text: "Items",
        color:"white",
        font: {size:26}
      }
    }
  }
});
</script>
</html>
