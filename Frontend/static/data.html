<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="inventory.css">
    <title>Graph</title>
  </head>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
<script src="../js/data.js"></script>
<body>
  <nav>
       <ul><a href="inventory.html">Inventory</a></ul>
         <ul><a href="show_recipies.html">Recipes</a></ul>
        <ul><a href="create.html">Create Ingredient</a></ul>
        <ul><a href="create_recipie.html">Create Recipe</a></ul>
    </nav>
    <div id="loading-screen">
          <div class="spinner">
          </div>
    </div>
    <div id="main-content" style="display: none;" ></div>
    <div class="container">
          <canvas id="myChart" style="width:100%;height: 710px;"></canvas>
    </div>

<script>
    let myChart;
const xValues = [100,200,300,400,500,600,700,800,900,1000];

let red = [860,1140,1060,1060,1070,1110,1330,2210,7830,2478]
let green = [1600,1700,1700,1900,2000,2700,4000,5000,6000,7000]
let blue = [300,700,2000,5000,6000,4000,2000,1000,200,100]


const ctx = document.getElementById('myChart');

myChart = new Chart(ctx, {
  type: "line",
  data: {
    labels: xValues,
    datasets: [{ 
      label: 'Red',
      data: [420,420,420,420,420,420,420,420,420,420],
      borderColor: "red",
      pointRadius: 2,
      tension: 0.4,
      color:"white"
    }]
  },
  options: {
    responsive: true,
    plugins: {legend:{labels:{color:"white"}},
      title: {
        display: true,
        text: 'Chart.js Line Chart',
        font: {
          size: 11
        },
        color:"white"
      },
      tooltip: {
        mode: 'index',
        intersect: false,
        color:"white"
      }
    },
    interaction: {
      mode: 'nearest',
      intersect: false,
      color:"white"

    },
    scales: {
      x: {
        display: true,
        title: {
          display: true,
          text: 'Days',
          color:"white"
        },
         ticks:{color:"white"},
         grid:{color:"white"}
      },
      y: {
        display: true,
        title: {
          display: true,
          text: 'Change',
          color:"white"
        },ticks:{ color:"white"},
        grid:{color:"white"}
      },
      
    }
  }
});

</script>

</body>
</html>
